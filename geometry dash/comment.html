<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Комментарии — Geometry Dash</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f7f7f7;
      color: #333;
    }
    h1 {
      text-align: center;
    }
    .giscus {
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <h1>💬 Комментарии</h1>
  <p>Здесь вы можете оставить свой комментарий — он сохранится на GitHub и будет виден всем!</p>

  <!-- Комментарии Giscus -->
  <div class="giscus">
    <script src="https://giscus.app/client.js"
      data-repo="Darumenchik/geometdy"
      data-repo-id=""
      data-category="General"
      data-category-id="CATEGORY_ID"
      data-mapping="pathname"
      data-strict="0"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="bottom"
      data-theme="light"
      data-lang="ru"
      crossorigin="anonymous"
      async>
    </script>
  </div>
</body>
</html>
