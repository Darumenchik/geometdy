<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chiper — AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <meta name="theme-color" content="#5DCA95">
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--text:#e6eef8;--muted:#9fb0c9;--accent:#5DCA95}
    html,body{height:100%;margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;color:var(--text);background:var(--bg)}
    header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.03)}
    .header-left{display:flex;align-items:center;gap:12px}
    .header-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--card);cursor:pointer}
    h2{margin:0;font-size:16px}

    /* Chat layout */
    main{display:flex;flex-direction:column;height:calc(100% - 56px)}
    .messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
    .msg{max-width:78%;padding:12px 14px;border-radius:14px;line-height:1.4}
    .msg.user{align-self:flex-end;background:linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));color:var(--text);border:1px solid rgba(255,255,255,0.04)}
    .msg.ai{align-self:flex-start;background:linear-gradient(90deg, rgba(93,202,149,0.08), rgba(93,202,149,0.02));color:var(--text);border:1px solid rgba(93,202,149,0.12)}
    .meta{font-size:12px;color:var(--muted);margin-top:6px}

    /* Thinking animation */
    .thinking{display:inline-flex;gap:6px;align-items:center}
    .dot{width:8px;height:8px;background:rgba(255,255,255,0.6);border-radius:50%;opacity:0.9;transform:translateY(0);animation:dot 1s infinite ease-in-out}
    .dot:nth-child(2){animation-delay:0.15s}
    .dot:nth-child(3){animation-delay:0.3s}
    @keyframes dot{0%{transform:translateY(0);opacity:0.4}50%{transform:translateY(-6px);opacity:1}100%{transform:translateY(0);opacity:0.4}}

    /* Input */
    .composer{display:flex;padding:12px;border-top:1px solid rgba(255,255,255,0.03);gap:8px;background:linear-gradient(180deg, rgba(0,0,0,0.06), transparent)}
    .composer input{flex:1;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.04);background:var(--card);color:var(--text)}
    .composer button{padding:10px 14px;border-radius:10px;border:none;background:var(--accent);color:#042016;cursor:pointer;font-weight:600}

    .suggested{display:flex;gap:8px;padding:10px 18px;overflow:auto}
    .suggested button{padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,0.04);background:rgba(255,255,255,0.02);color:var(--muted);cursor:pointer}

    .source{font-size:12px;color:var(--muted);margin-top:6px}

    ::-webkit-scrollbar{width:8px}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.06);border-radius:6px}
  </style>
  </head>
<body>
  <header>
    <div class="header-left">
      <div class="header-icon" id="btn-back"><i class="fas fa-arrow-left"></i></div>
      <h2>Чипер AI</h2>
    </div>
  </header>

  <main>
    <div class="messages" id="messages">
      <div class="msg ai">
        Привет! Я Чипер‑AI. Задай вопрос про приложение — я подумаю и отвечу.
        <div class="meta">Подсказки внизу • Быстрая локальная база</div>
      </div>
    </div>

    <div class="suggested" id="suggested"></div>

    <div class="composer">
      <input id="input" placeholder="Напишите вопрос и нажмите Enter...">
      <button id="send">Отправить</button>
    </div>
  </main>

  <script src="ai-data.js"></script>
  <script>
    (function(){
      const messagesEl = document.getElementById('messages');
      const inputEl = document.getElementById('input');
      const sendBtn = document.getElementById('send');
      const suggestedEl = document.getElementById('suggested');

      // Preprocess data for faster matching
      const rawData = window.aiData || [];
      const data = rawData.map(it => {
        const nq = normalize(it.q);
        const tokens = new Set(nq.split(' ').filter(Boolean));
        return { q: it.q, a: it.a, nq, tokens };
      });

      // initialize suggested chips
      function initSuggested(){
        const picks = [0,5,12,20,33].map(i=>data[i]).filter(Boolean);
        picks.forEach(p=>{
          const b = document.createElement('button');
          b.textContent = p.q;
          b.onclick = () => handleUserQuery(p.q);
          suggestedEl.appendChild(b);
        });
      }

      // add message bubble
      function pushMessage(kind, text, meta){
        const el = document.createElement('div');
        el.className = 'msg ' + (kind === 'user' ? 'user' : 'ai');
        el.innerHTML = `<div class="content">${escapeHtml(text)}</div>` + (meta?`<div class="source">${escapeHtml(meta)}</div>`:'');
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return el;
      }

      function escapeHtml(s){ return (s+'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]||c)); }

      // optimized matching: use precomputed normalized questions and token sets
      function findBestAnswer(query){
        const qn = normalize(query);
        if(!qn) return { item: null, score: 0 };

        // exact match
        for(const it of data) if(it.nq === qn) return { item: it, score: 999 };
        // substring match
        for(const it of data) if(it.nq.includes(qn) || qn.includes(it.nq)) return { item: it, score: 900 };

        // token overlap scoring
        const qtokens = qn.split(' ').filter(Boolean);
        let best = null, bestScore = 0;
        for(const it of data){
          let common = 0;
          for(const w of qtokens) if(it.tokens.has(w)) common++;
          if(common > bestScore){ bestScore = common; best = it; }
        }
        return { item: best, score: bestScore };
      }

      function normalize(s){ return (s||'').toLowerCase().replace(/[^a-zа-я0-9\sё]/gi,'').replace(/\s+/g,' ').trim(); }

      // thinking animation element
      function createThinkingEl(){
        const el = document.createElement('div');
        el.className = 'msg ai';
        el.innerHTML = `<div class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return el;
      }

      // compute delay based on query length and match score (400..3000ms)
      function computeDelay(query, score){
        const words = (query||'').trim().split(/\s+/).filter(Boolean).length || 1;
        const len = (query||'').trim().length || 1;
        let delay = 400 + Math.min(2200, words * 180 + Math.min(800, len * 3));
        if(score >= 5) delay = Math.max(350, delay - 900);
        if(score <= 1) delay = Math.min(3000, delay + 600);
        return Math.max(350, Math.min(3000, Math.round(delay)));
      }

      // typing reveal for answer
      function revealText(el, text, cb){
        const content = el.querySelector('.content');
        content.textContent = '';
        let i = 0; const speed = 14;
        const t = setInterval(()=>{
          i += 1;
          content.textContent = text.slice(0,i);
          messagesEl.scrollTop = messagesEl.scrollHeight;
          if(i>=text.length){ clearInterval(t); if(cb) cb(); }
        }, speed);
      }

      // main flow when user asks
      function handleUserQuery(text){
        if(!text || !text.trim()) return;
        pushMessage('user', text);
        inputEl.value = '';

        const thinkingEl = createThinkingEl();

        const res = findBestAnswer(text) || { item: null, score: 0 };
        const delay = computeDelay(text, res.score || 0);

        setTimeout(()=>{
          thinkingEl.remove();
          const item = res.item;
          let answer = 'Извините, не нашёл точного ответа. Попробуйте переформулировать вопрос.';
          let meta = '';
          if(item){ answer = item.a; meta = 'Источник: локальная база'; }

          const aiEl = pushMessage('ai', '...', meta);
          revealText(aiEl, answer, ()=>{});
        }, delay);
      }

      // wire UI
      sendBtn.onclick = () => handleUserQuery(inputEl.value);
      inputEl.addEventListener('keydown', e=>{ if(e.key === 'Enter') { e.preventDefault(); handleUserQuery(inputEl.value); } });

      initSuggested();

      document.getElementById('btn-back').onclick = () => { history.back(); };
    })();
  </script>
</body>
</html>
