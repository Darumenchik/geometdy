<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Screen</title>
    <style>
        /* --- Сброс стилей и шрифты --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 20px;
            color: #1e293b;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        /* --- Анимации --- */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-20px);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .animate {
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }

        /* --- Верхняя часть (Лого и заголовок) --- */
        .content-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Логотип с адаптацией */
        .logo-container {
            width: min(250px, 70vw);
            height: min(250px, 70vw);
            margin-bottom: min(40px, 5vh);
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(100, 116, 139, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: white;
            border: 8px solid white;
        }

        .logo-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 45px rgba(100, 116, 139, 0.15);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .logo-container:hover img {
            transform: scale(1.1);
        }

        h1 {
            font-size: clamp(20px, 5vw, 28px);
            font-weight: 700;
            margin-bottom: 15px;
            color: #334155;
            line-height: 1.3;
            padding: 0 10px;
        }

        /* --- Текст соглашения --- */
        .terms-text {
            font-size: clamp(13px, 3.5vw, 15px);
            line-height: 1.6;
            color: #64748b;
            margin-bottom: min(30px, 4vh);
            max-width: 90%;
            padding: 20px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .terms-text a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
            position: relative;
            transition: color 0.2s ease;
        }

        .terms-text a:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        /* --- Нижняя часть (Язык и кнопка) --- */
        .bottom-actions {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: max(20px, 5vh);
        }

        /* Селектор языка */
        .language-selector {
            position: relative;
            background: white;
            border-radius: 24px;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            cursor: pointer;
            margin-bottom: 25px;
            color: #475569;
            font-weight: 600;
            font-size: clamp(14px, 4vw, 16px);
            min-width: 140px;
            transition: all 0.3s ease;
            border: 2px solid #e2e8f0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .language-selector:hover {
            background-color: #f8fafc;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-color: #cbd5e1;
        }

        .language-selector:active {
            transform: translateY(0);
        }

        .language-selector.active {
            border-color: #94a3b8;
            background-color: #f1f5f9;
        }

        .globe-icon {
            margin-right: 12px;
            font-size: clamp(16px, 4.5vw, 18px);
            animation: slideInRight 0.5s ease-out;
            color: #64748b;
        }

        .arrow-icon {
            margin-left: 12px;
            font-size: 12px;
            transition: transform 0.3s ease;
            color: #94a3b8;
        }

        .language-selector:hover .arrow-icon {
            transform: translateY(2px);
        }

        /* Скрытый select */
        #langSelect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            font-size: 16px;
        }

        /* Главная кнопка - СЕРАЯ */
        .btn-primary {
            background: linear-gradient(135deg, #94a3b8, #64748b);
            color: white;
            width: 100%;
            padding: clamp(14px, 4vw, 18px);
            border: none;
            border-radius: 24px;
            font-size: clamp(15px, 4vw, 17px);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(100, 116, 139, 0.2);
            letter-spacing: 0.5px;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #64748b, #475569);
            box-shadow: 0 15px 35px rgba(100, 116, 139, 0.3);
            transform: translateY(-3px);
        }

        .btn-primary:active {
            transform: translateY(0);
            box-shadow: 0 5px 15px rgba(100, 116, 139, 0.2);
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%, -50%);
            transform-origin: 50% 50%;
        }

        .btn-primary:focus:not(:active)::after {
            animation: ripple 1s ease-out;
        }

        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 0.5;
            }
            100% {
                transform: scale(40, 40);
                opacity: 0;
            }
        }

        .btn-primary.pulse {
            animation: pulse 0.5s ease-in-out;
        }

        /* Адаптация для мобильных */
        @media (max-width: 480px) {
            body {
                padding: 15px;
                background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            }
            
            .content-wrapper {
                padding-top: 20px;
            }
            
            .logo-container {
                width: 200px;
                height: 200px;
                border: 6px solid white;
            }
            
            .bottom-actions {
                width: 90%;
            }
            
            .terms-text {
                padding: 16px;
            }
        }

        @media (max-height: 700px) {
            .logo-container {
                width: 180px;
                height: 180px;
                margin-bottom: 25px;
            }
            
            h1 {
                font-size: 22px;
                margin-bottom: 12px;
            }
            
            .terms-text {
                margin-bottom: 20px;
                padding: 16px;
            }
            
            .language-selector {
                margin-bottom: 20px;
                padding: 12px 20px;
            }
        }

        @media (max-height: 600px) {
            .logo-container {
                width: 150px;
                height: 150px;
            }
            
            .content-wrapper {
                justify-content: flex-start;
                padding-top: 30px;
            }
        }

        /* Индикатор загрузки */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #64748b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            color: #334155;
            font-weight: 500;
        }

        /* Эффект частиц для фона */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: rgba(203, 213, 224, 0.2);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Акцентные элементы */
        .accent-dot {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(203, 213, 224, 0.1), rgba(148, 163, 184, 0.05));
            z-index: -1;
            filter: blur(40px);
        }

        .accent-dot-1 {
            top: -100px;
            right: -100px;
        }

        .accent-dot-2 {
            bottom: -100px;
            left: -100px;
        }
    </style>
    <script src="translations.js"></script>
</head>
<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Загрузка...</div>
    </div>

    <div class="content-wrapper animate" id="contentWrapper">
        <div class="logo-container">
            <img src="logo.png" alt="App Logo"> 
        </div>

        <h1 id="welcomeTitle">Добро пожаловать в Chiper</h1>

        <p class="terms-text" id="termsText">
            Ознакомьтесь с нашими <a href="\privacy.html" target="_blank">Политиками конфиденциальности</a>. Нажмите "Принять и продолжить", чтобы принять <a href="/terms.html" target="_blank">Пользовательское соглашение</a>.
        </p>
    </div>

    <div class="bottom-actions animate" style="animation-delay: 0.2s;">
        <div class="language-selector" id="languageSelector">
            <span class="globe-icon">🌐</span>
            <span id="currentLangText">Русский</span>
            <span class="arrow-icon">▼</span>
            
            <select id="langSelect">
                <option value="ru" selected>Русский</option>
                <option value="kk">Қазақша</option>
                <option value="en">English</option>
            </select>
        </div>

        <button class="btn-primary" id="btnAction">Принять и продолжить</button>
    </div>

    <script>
        // Объект с переводами

        // Элементы DOM
        const langSelect = document.getElementById('langSelect');
        const currentLangText = document.getElementById('currentLangText');
        const welcomeTitle = document.getElementById('welcomeTitle');
        const termsText = document.getElementById('termsText');
        const btnAction = document.getElementById('btnAction');
        const contentWrapper = document.getElementById('contentWrapper');
        const bottomActions = document.querySelector('.bottom-actions');
        const languageSelector = document.getElementById('languageSelector');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');

        // Ключ для localStorage
        const STORAGE_KEY = 'app_welcome_shown';
        const LANGUAGE_KEY = 'app_language';

        // Проверяем, показывался ли уже экран приветствия
        const welcomeShown = localStorage.getItem(STORAGE_KEY) === 'true';
        
        // Если уже показывался - редирект на main2.html
        if (welcomeShown) {
            window.location.href = 'main2.html';
        }

        // Загружаем сохраненный язык или устанавливаем по умолчанию
        const savedLanguage = getCurrentLanguage();
        langSelect.value = savedLanguage;
        applyLanguage(savedLanguage);

        // Функция обновления языка
        function applyLanguage(lang) {
            setLanguage(lang);
            const tr = getLanguageTranslations();
            welcomeTitle.style.opacity = 0;
            termsText.style.opacity = 0;
            btnAction.style.opacity = 0;
            currentLangText.innerText = tr.langNameRu || lang;

            setTimeout(() => {
                welcomeTitle.innerText = tr.welcomeTitle || 'Welcome';
                termsText.innerHTML = tr.termsText || '';
                btnAction.innerText = tr.btnAccept || btnAction.innerText;
                loadingText.innerText = tr.loading || loadingText.innerText;

                welcomeTitle.style.opacity = 1;
                termsText.style.opacity = 1;
                btnAction.style.opacity = 1;
                languageSelector.classList.remove('active');
            }, 200);
        }

        // Слушатель изменения языка
        langSelect.addEventListener('change', (e) => {
            const lang = e.target.value;
            applyLanguage(lang);
        });

        // Плавные переходы
        welcomeTitle.style.transition = "opacity 0.3s ease, transform 0.3s ease";
        termsText.style.transition = "opacity 0.3s ease, transform 0.3s ease";
        btnAction.style.transition = "opacity 0.3s ease, transform 0.3s ease";

        // Обработчик кнопки "Принять и продолжить"
        btnAction.addEventListener('click', function() {
            // Сохраняем в localStorage, что экран приветствия был показан
            localStorage.setItem(STORAGE_KEY, 'true');
            
            // Добавляем анимацию пульсации
            this.classList.add('pulse');
            
            // Анимация исчезновения контента
            contentWrapper.classList.add('fade-out');
            bottomActions.classList.add('fade-out');
            
            // Показываем индикатор загрузки
            setTimeout(() => {
                loadingOverlay.classList.add('active');
                
                // Переход на следующий экран с задержкой
                setTimeout(() => {
                    window.location.href = 'main2.html';
                }, 1000);
            }, 300);
        });

        // Анимация при наведении на кнопку
        btnAction.addEventListener('mouseenter', function() {
            this.style.transform = 'translateY(-2px)';
        });
        
        btnAction.addEventListener('mouseleave', function() {
            this.style.transform = 'translateY(0)';
        });

        // Обработчик для select, чтобы показать активное состояние
        langSelect.addEventListener('focus', () => {
            languageSelector.classList.add('active');
        });
        
        langSelect.addEventListener('blur', () => {
            setTimeout(() => {
                languageSelector.classList.remove('active');
            }, 200);
        });

        // Адаптация для разных устройств
        function checkScreenSize() {
            if (window.innerWidth < 480) {
                document.body.style.padding = '10px';
            } else {
                document.body.style.padding = '20px';
            }
        }

        window.addEventListener('resize', checkScreenSize);
        checkScreenSize();

        // Задержка для плавного появления
        setTimeout(() => {
            document.body.style.opacity = 1;
        }, 100);

        // Инициализация прозрачности
        document.body.style.opacity = 0;
        document.body.style.transition = 'opacity 0.5s ease';
    </script>
</body>
</html>
